{% extends "base.html" %}
{% block content %}
<style>
    .container { max-width: 600px; margin: 50px auto; padding: 0 20px; }
    .checkout-box { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 35px; }
    h1 { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 8px; }
    p { color: #9ca3af; font-size: 14px; margin-bottom: 25px; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; color: #d1d5db; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input, select { width: 100%; padding: 12px; background: #030712; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #00e5ff; }
    
    .pay-btn {
        width: 100%; background: #22c55e; color: #fff; border: none; padding: 14px;
        border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px;
        transition: background 0.2s;
    }
    .pay-btn:hover { background: #16a34a; }
</style>

<div class="container">
    <div class="checkout-box">
        <h1>Veilig Afrekenen</h1>
        <p>Vul je gegevens in om de bestelling van € {{ "%.2f"|format(totaal) }} af te ronden.</p>
        
        <form method="POST">
            <div class="form-group">
                <label>Volledige Naam</label>
                <input type="text" required placeholder="Bijv. Sam de Vries">
            </div>
            <div class="form-group">
                <label>Bezorgadres</label>
                <input type="text" required placeholder="Straatnaam en huisnummer">
            </div>
            <div class="form-group">
                <label>Betaalmethode</label>
                <select>
                    <option>iDEAL (Direct Betalen)</option>
                    <option>Creditcard (Mastercard / Visa)</option>
                    <option>Klarna Achteraf Betalen</option>
                </select>
            </div>
            <button type="submit" class="pay-btn">Bestelling Plaatsen & Betalen</button>
        </form>
    </div>
</div>
{% endblock %}
