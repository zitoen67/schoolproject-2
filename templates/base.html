<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPE LAB // Official Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
        .neon-text { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        /* Pop-up Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 3000;
        }
        .modal-box {
            background: #111827; border: 1px solid #1f2937; border-radius: 16px;
            padding: 35px; text-align: center; max-width: 440px; width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }
        .modal-box h2 { color: #fff; margin-bottom: 10px; font-size: 24px; font-weight: 800; }
        .modal-box p { color: #9ca3af; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .location-box { background: #030712; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #38bdf8; border: 1px solid #1f2937; }
        .modal-btn {
            background: linear-gradient(135deg, #00e5ff, #3b82f6); color: #030712;
            border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700;
            cursor: pointer; font-size: 15px; width: 100%; transition: opacity 0.2s;
        }
        .modal-btn:hover { opacity: 0.9; }

        header {
            background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px);
            padding: 18px 8%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 900; color: #fff; text-decoration: none; }
        .logo span { color: #00e5ff; }
        nav { display: flex; gap: 30px; align-items: center; }
        nav a { color: #9ca3af; text-decoration: none; font-size: 14px; font-weight: 600; }
        nav a:hover, nav a.active { color: #00e5ff; }
        .cart-badge { background: #00e5ff; color: #030712; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 800; }

        .content { flex: 1; }
        footer { background: #030712; text-align: center; padding: 25px; color: #6b7280; font-size: 13px; border-top: 1px solid #1f2937; }
    </style>
</head>
<body>

<!-- Welkomst & Locatie Pop-up -->
<div id="welcome-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h2>VAPE <span style="color:#00e5ff;">LAB</span></h2>
        <p>Bevestig dat je 18+ bent en ga akkoord om je regio te laden voor deze showroom.</p>
        <div class="location-box" id="locatie-status">Regio controleren...</div>
        <button class="modal-btn" onclick="startSite()">Akkoord & Doorgaan</button>
    </div>
</div>

<header>
    <a href="/" class="logo">VAPE<span>LAB</span></a>
    <nav>
        <a href="/">Home</a>
        <a href="/producten">Catalogus</a>
        <a href="/winkelmand">Winkelmand <span class="cart-badge">{{ session.get('cart', {}).values()|sum(attribute='aantal') }}</span></a>
    </nav>
</header>

<div class="content">
    {% block content %}{% endblock %}
</div>

<footer>
    VAPE LAB // Schoolproject E-Commerce Demo © 2026
</footer>

<script>
    // Toon de pop-up alleen als deze sessie nog niet is gestart
    if (!sessionStorage.getItem('popupGezien')) {
        document.getElementById('welcome-modal').style.display = 'flex';
        
        // Laad alvast globale IP-regio ter informatie in de box
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                document.getElementById('locatie-status').innerText = `Gedetecteerde Regio: ${data.city}, ${data.country_name}`;
            })
            .catch(() => {
                document.getElementById('locatie-status').innerText = `Regio: Nederland (Online Demo)`;
            });
    }

    // Zodra de gebruiker op "Akkoord & Doorgaan" klikt, triggert de browser de GPS-toestemming
    function startSite() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Coördinaten succesvol opgehaald
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    sessionStorage.setItem('gebruikerLat', lat);
                    sessionStorage.setItem('gebruikerLon', lon);
                    sluitPopup();
                },
                (error) => {
                    // Als de gebruiker op "Blokkeer" drukt, sluiten we de popup alsnog gewoon
                    sluitPopup();
                },
                { timeout: 4000 }
            );
        } else {
            sluitPopup();
        }
    }

    function sluitPopup() {
        sessionStorage.setItem('popupGezien', 'true');
        document.getElementById('welcome-modal').style.display = 'none';
    }
</script>

</body>
</html>
