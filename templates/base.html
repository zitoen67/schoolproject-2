<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPE LAB // Official Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }

        /* Vibe / Neon Glow Accent */
        .neon-text { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        /* Pop-up Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 3000;
        }
        .modal-box {
            background: #111827; border: 1px solid #1f2937; border-radius: 16px;
            padding: 35px; text-align: center; max-width: 420px; width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .modal-box h2 { color: #fff; margin-bottom: 10px; font-size: 24px; font-weight: 800; }
        .modal-box p { color: #9ca3af; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .modal-btn {
            background: linear-gradient(135deg, #00e5ff, #3b82f6); color: #030712;
            border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700;
            cursor: pointer; font-size: 15px; width: 100%; transition: opacity 0.2s;
        }
        .modal-btn:hover { opacity: 0.9; }

        /* Header / Navbar */
        header {
            background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px);
            padding: 18px 8%; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: 1px; }
        .logo span { color: #00e5ff; }
        nav { display: flex; gap: 30px; align-items: center; }
        nav a { color: #9ca3af; text-decoration: none; font-size: 14px; font-weight: 600; transition: color 0.2s; }
        nav a:hover, nav a.active { color: #00e5ff; }
        .cart-badge {
            background: #00e5ff; color: #030712; padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 800; margin-left: 5px;
        }

        /* Main Content */
        .content { flex: 1; }

        /* Footer */
        footer {
            background: #030712; text-align: center; padding: 30px;
            color: #6b7280; font-size: 13px; border-top: 1px solid #1f2937; margin-top: auto;
        }
    </style>
</head>
<body>

<!-- Welkomst Pop-up -->
<div id="welcome-modal" class="modal-overlay">
    <div class="modal-box">
        <h2>VAPE <span style="color:#00e5ff;">LAB</span></h2>
        <p>Welkom in onze digitale showroom. Ontdek de nieuwste hardware, high-end e-liquids en populaire wegwerp vapes.</p>
        <button class="modal-btn" onclick="document.getElementById('welcome-modal').style.display='none'">Assortiment Bekijken</button>
    </div>
</div>

<header>
    <a href="/" class="logo">VAPE<span>LAB</span></a>
    <nav>
        <a href="/">Home</a>
        <a href="/producten">Catalogus</a>
        <a href="/winkelmand">Winkelmand <span class="cart-badge">{{ session.get('cart', [])|length }}</span></a>
    </nav>
</header>

<div class="content">
    {% block content %}{% endblock %}
</div>

<footer>
    VAPE LAB // Schoolproject E-Commerce Demo © 2026
</footer>

</body>
</html>
