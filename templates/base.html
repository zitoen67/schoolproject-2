<button onclick="vraagLocatie()" style="background: #00e5ff; color: #030712; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
    Vind mijn exacte locatie (GPS)
</button>

<p id="gps-resultaat" style="color: #9ca3af; margin-top: 10px; font-size: 13px;"></p>

<script>
    function vraagLocatie() {
        const status = document.getElementById('gps-resultaat');

        if (!navigator.geolocation) {
            status.innerText = "Jouw browser ondersteunt geen geolocatie.";
            return;
        }

        status.innerText = "Locatie opvragen... Klik op 'Toestaan' in je browser.";

        navigator.geolocation.getCurrentPosition((position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            status.innerHTML = `Gevonden! Coördinaten: <br>Breedtegraad: ${lat} <br>Lengtegraad: ${lon}`;
            
            // Hier kun je de coördinaten eventueel via een fetch() naar je Flask app sturen als je dat wilt!
            
        }, () => {
            status.innerText = "Locatie delen geweigerd door de gebruiker.";
        });
    }
</script>
